services:
    mc-botserver:
        image: mc-bot/botserver:latest
        build: .
        container_name: mc-botserver
        restart: unless-stopped
        networks:
            - mcbot
        ports:
            - "8000:8000"
        environment:
            - PORT=8000
            - HOST=0.0.0.0
        volumes:
            - ./.env:/app/.env
            - ./Plugins:/app/Plugins
            - ./Resources:/app/Resources
            - ./Scripts:/app/Scripts
            - ./Logs:/app/Logs
            - ./Data:/app/Data
        secrets:
            - bot_service_key

secrets:
    bot_service_key:
        file: ~/.ssh/bot_service  # 专用私钥，仅用于 SSH 到宿主机执行 service.sh

networks:
    mcbot:
        name: mc-bot
        external: true
